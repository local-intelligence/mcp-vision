[project]
name = "mcp-vision"
version = "0.1.0"
description = "MCP server providing snapshot vision + mic transcription with explicit arming."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Austin" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["mcp_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
