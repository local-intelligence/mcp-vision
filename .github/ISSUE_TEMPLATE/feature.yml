name: Feature
description: Propose a feature or enhancement
title: "[v0.x] "
labels: ["type:implementation"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What do we want to achieve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of what "done" means.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / context
      description: Links, constraints, safety implications.
    validations:
      required: false
